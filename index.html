<style>
    /* Intro overlay that slides up */
    .intro {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;
        /* important so blur doesn't overflow */
        background: #ffffff;
        /* base color */
        z-index: 9999;

        transition: transform 4000ms ease, opacity 400ms ease;
        transform: translateY(0);
    }

    .intro.hidden {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
    }



    .intro::before {
        content: "";
        position: absolute;
        inset: 0;

        background-image: url("melostudio_circle_background.png");
        background-size: 70%;
        background-repeat: no-repeat;
        background-position: center;
        transform: scale(1.05);
        /* prevents edges from showing */
        z-index: -1;
        /* keep it behind your logo/text */
    }

    /* Translucent + blur overlay (frosted glass effect) */
    .intro::after {
        content: "";
        position: absolute;
        inset: 0;

        background: rgba(105, 215, 84, 0.25);
        /* ↑ You can make this any color + opacity */

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        /* ↑ The important part! Blurs whatever is behind it */

        z-index: -1;
    }

    /*split page in half */
    :root {
        --gap: 0;
    }

    html,
    body {
        margin: 0;
        height: 100%;
        font-family: system-ui, Arial, sans-serif;
    }

    .split {
        display: flex;
        height: 100vh;
        /*full viewport height*/
        gap: var(--gap);
        overflow: hidden;
    }

    .left {
        flex: 1 1 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0px;
        padding-bottom: 30px;
        box-sizing: border-box;
    }

    .right {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        padding: 24px;
        box-sizing: border-box;
    }

    .right::before {
        content: "";
        position: absolute;
        inset: 0;

        background: rgba(105, 215, 84, 0.25);
        /* ↑ You can make this any color + opacity */

        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        /* ↑ The important part! Blurs whatever is behind it */

        z-index: -1;
    }

    .right::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom,
                rgba(122, 206, 19, 0.733),
                rgba(255, 255, 255, 0));
        backdrop-filter: blur(25px);
        pointer-events: none;
    }


    /* visual styles of each half */
    .left {
        background: #e7ffde;
    }

    .right {
        background: #ffffff;
        background-image: url("melostudio_circle_background.png");
        background-size: 120%;
        background-repeat: no-repeat;
        background-position: -530px 110px;
        transform: scale(1.05);
        align-items: center;
    }

    /*work and contact right tabs*/
    .uppertabs {
        position: absolute;
        right: 65.2%;
        top: 20%;
        display: flex;
        flex-direction: row;
        gap: 0px;
        width: 300px;
    }

    .uppertab {
        background: rgba(255, 255, 255, 100);
        border: 1px solid #9FEE3E;
        padding: 20px 25px;
        text-align: left;
        border-radius: 30px 30px 0px 0px;
        cursor: pointer;
        transition: background 180ms ease, color 180ms ease;



        font-family: "Montserrat", sans-serif;
        font-optical-sizing: auto;
        font-weight: 600;
        font-style: normal;
        color: #9FEE3E;
        font-size: 17px;
    }

    .uppertab:hover {
        background: rgba(110, 190, 255, 0.60);
        color: #ffffff;

    }

    .uppertab.active {
        background: #6ebeff;
        color: #ffffff;


    }


    /* Tabs on the right side */
    .tabs {
        position: absolute;
        right: 15%;
        top: 35%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
        
    }

    /* --- DOMINO INDENTING --- */

    /* Row 1 (items 1–4) */
    .tabs>*:nth-child(n + 1):nth-child(-n + 4) {
        margin-left: 0px;
    }

    /* Row 2 (items 5–8) */
    .tabs>*:nth-child(n + 5):nth-child(-n + 8) {
        transform: translateX(70px);
    }

    /* Row 3 (items 9–12) */
    .tabs>*:nth-child(n + 9):nth-child(-n + 12) {
        transform: translateX(80px);
    }

    /* Row 4 (items 13–16) */
    .tabs>*:nth-child(n + 13):nth-child(-n + 16) {
        transform: translateX(120px);
    }

    .tab {
        background: rgba(255, 255, 255, 0.08);
        color: #9FEE3E;
        border: none;
        padding: 10px 16px;
        text-align: center;
        border-radius: 8px;
        cursor: pointer;

        font-family: "Montserrat", sans-serif;
        font-weight: 500;
        font-size: 18px;
        transition: background 180ms ease, color 180ms ease;
    }

    .tab:hover {
        background: rgba(255, 255, 255, 0.14);
    }

    .tab.active {
        background: #fff;
        color: #6EBEFF;
        font-weight: 500;
    }

    /* responsive: stack on small screens */
    @media (max-width:720px) {
        .split {
            flex-direction: column;
            min-height: 100vh;
        }

        .tabs {
            position: static;
            flex-direction: row;
            gap: 8px;
            width: auto;
            padding: 12px;
        }

        .right {
            padding-top: 8px;
        }

        .divider {
            height: 1px;
            width: 100%;
            background: rgba(0, 0, 0, 0.06);
        }
    }

    .image-grid {
        display: grid;
        gap: 20px;
        margin-top: 20px;
        justify-items: start;
        align-items: start
    }

    /* layouts */
    .grid-1 {
        grid-template-columns: 1fr;
        max-width: 800px;
        min-width: 100%;
    }

    .grid-2 {
        grid-template-columns: repeat(2, 1fr);
        max-width: 800px;
        min-width: 100%;

    }

    .grid-3 {
        grid-template-columns: 1fr;
        max-width: 800px;
        min-width: 100%;
    }

    .grid-4 {
        grid-template-columns: repeat(3, 1fr);
        max-width: 800px;
        min-width: 100%;

    }

    .image-grid img {
        width: 100%;
        height: auto;
        border-radius: 8px;
        transition: 0.2s ease;
    }

    /* BIG images for 1-column layout */
    .grid-1 img {
        max-width: 800px;
        /* large layout */
    }

    /* MEDIUM images for 2-column layout */
    .grid-2 img {
        max-width: 300px;
        /* you can change this */
    }

    /* SMALL images for 3-column layout */
    .grid-3 img {
        max-width: 600px;
    }

    /* VERY SMALL for 4-per-row */

        max-width: 270px;

    <script>
        // hide the intro after 2 seconds
        window.addEventListener('load', () => {
            const intro = document.getElementById('intro');
            setTimeout(() => intro.classList.add('hidden'), 1000); // from 1000
        });

        // work contact upper tabs
        (function () {
            const uppertabs = Array.from(document.querySelectorAll('.uppertab'));
            const rightContent = document.getElementById('rightContent');
            const tabsSection = document.querySelector('.tabs'); //lower work tabs
            const latestWork = document.querySelector('.latestwork');
            const cookingupsomething = document.querySelector('.cookingupsomething');
            const bottomtabs = document.querySelector('.bottomtabs');


            function setActive(tab) {
                uppertabs.forEach(t => t.classList.toggle('active', t === tab));
            }

            function updateRight(title, body) {
                const content = document.getElementById('rightContent');
                // simple fade-out, replace, fade-in
                //rightContent.classList.add('is-hidden');
                setTimeout(() => {
                    // If the tab is "Works", show the lower tabs again
                    if (title === "Works") {
                        tabsSection.style.display = 'grid';
                        latestWork.style.display = 'block';
                        cookingupsomething.style.display = 'block';
                        bottomtabs.style.display = 'grid';
                        rightContent.innerHTML = "";
                        rightContent.appendChild(tabsSection);
                        rightContent.appendChild(latestWork);
                        rightContent.appendChild(cookingupsomething);
                        rightContent.appendChild(bottomtabs);
                    } else {
                        cookingupsomething.style.display = 'none';
                        tabsSection.style.display = 'none';
                        bottomtabs.style.display = 'none';
                        latestWork.style.display = 'none';
                        rightContent.innerHTML = `<h1>${title}</h1>${body}`;
                    }
                    rightContent.classList.remove('is-hidden');
                }, 180);

            }

            uppertabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    setActive(tab);
                    updateRight(tab.dataset.title, tab.dataset.body);
                    // Here you can add functionality to change right side content
                });
                tab.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        tab.click();
                    }
                });
            });
        })();

        // Tab interaction
        (function () {
            const tabs = Array.from(document.querySelectorAll('.tab'));
            const leftContent = document.getElementById('leftContent');
            const leftHeader = document.getElementById('leftHeader');

            function setActive(tab) {
                tabs.forEach(t => t.classList.toggle('active', t === tab));
            }


            function updateLeft(title, body, imgList) {
                let content = `<p>${body}</p>`;
                leftHeader.textContent = title;

                if (imgList) {
                    // Split by each 'gridX|' and keep the grid type
                    const groups = imgList.split(/grid\d+\|/).filter(s => s.trim() !== '');
                    const gridTypes = [...imgList.matchAll(/grid(\d+)\|/g)].map(m => m[1]);

                    groups.forEach((groupImgs, i) => {
                        const gridNum = gridTypes[i] || 1; // default to 1 if missing
                        content += `<div class="image-grid grid-${gridNum}">`;

                        groupImgs.split(",").forEach(img => {
                            const src = img.trim();
                            if (src) content += `<img src="${src}">`;
                        });

                        content += `</div>`;
                    });
                }

                setTimeout(() => {
                    const scrollPos = leftContent.scrollTop;
                    leftContent.innerHTML = content;
                    leftContent.scrollTop = 0;
                    leftContent.classList.remove("is-hidden");
                }, 180);
            }

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    setActive(tab);
                    const imgList = tab.dataset.imgs || null;
                    updateLeft(tab.dataset.title, tab.dataset.body, imgList);
                });
                tab.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        tab.click();
                    }
                });
            });

            const activeTab = document.querySelector('.tab.active');
            if (activeTab) {
                updateLeft(activeTab.dataset.title, activeTab.dataset.body, activeTab.dataset.imgs || null);
            }

        })();


    </script>


</body>
